[project]
name = "openalex-mcp"
version = "0.1.0"
description = "MCP server for OpenAlex literature search with local caching and analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "严寅中 (Yinzhong Yan)", email = "yinzhong.yan@nwpu.edu.cn" },
]
keywords = ["mcp", "openalex", "literature", "sqlite", "semantic-search", "citation-network", "bibtex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.24.0",
    "networkx>=3.2.0",
    "scipy>=1.10.0",
    "pyvis>=0.3.2",
    "pypdf>=4.0",
]

[project.scripts]
openalex-mcp = "openalex_mcp.registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openalex_mcp"]
